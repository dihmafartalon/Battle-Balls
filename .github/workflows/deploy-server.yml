# Deploys the room server (server/) to Cloudflare -- no computer needed.
# It runs by itself whenever something in server/ changes on main, and from
# the Actions tab: "Deploy server" > "Run workflow".
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the
#                          "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID (Workers & Pages page)
name: Deploy server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server tests
        working-directory: server
        run: node tools/test-econ.mjs && node tools/test-dir.mjs
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
