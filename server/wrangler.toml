name = "battle-balls-rooms"
main = "src/index.js"
compatibility_date = "2026-01-01"

# one Room per lobby code, and one Vault per Google account (cloud saves)
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

# the player list the admin page reads: one for the whole game
[[durable_objects.bindings]]
name = "DIR"
class_name = "Directory"

# social (4.1): one Hub per account (friends, presence, messages, invites)
# and one Party per party
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[durable_objects.bindings]]
name = "PARTY"
class_name = "Party"

# SQLite-backed Durable Objects are what the free Workers plan supports
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Vault"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Hub", "Party"]

[vars]
# Redeem codes only work for these accounts: your Google account number (the
# "Account ..." number shown for you on /admin). Several: separate with commas.
OWNER_ACCOUNTS = ""
# the "Client ID" from Google Cloud > APIs & Services > Credentials
GOOGLE_CLIENT_ID = "710765331188-b711mqvsvv7kf9n08f41suvmf030fav5.apps.googleusercontent.com"

# The admin page (/admin) needs a password. It is a secret, never in this file:
#   npx wrangler secret put ADMIN_KEY
# Without it the admin page stays locked for everyone.
